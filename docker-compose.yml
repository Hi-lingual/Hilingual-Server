version: "3.8"

services:
  spring-blue:                     # 🔵 기존 컨테이너(또는 새 컨테이너) 후보
    build: .                       # 현재 디렉토리의 Dockerfile 로 이미지 생성하겠음
    container_name: hilingual-blue # 컨테이너 이름
    ports: ["8081:8080"]           # (호스트 8081) → (컨테이너 8080)
    environment:                   # 런타임 변수
      SPRING_PROFILES_ACTIVE: blue # @Profile("blue")
      TZ: Asia/Seoul
      LOGGING_FILE_NAME: /logs/app.log
    env_file:
      - .env
    volumes:
      - /var/log/spring/blue:/logs

    networks: [app-net]            # bridge 네트워크 설정

  spring-green:                    # 🟢 새 버전을 띄울 때 사용하는 쌍둥이 서비스
    build: .                       # 컨테이너 이름
    container_name: hilingual-green
    ports: ["8082:8080"]           # (호스트 8082) → (컨테이너 8080)
    environment:
      SPRING_PROFILES_ACTIVE: green
      TZ: Asia/Seoul
      LOGGING_FILE_NAME: /logs/app.log
    env_file:
      - .env
    volumes:
      - /var/log/spring/green:/logs
    networks: [app-net]

  redis:
    image: redis:7-alpine
    container_name: hilingual-redis
    restart: unless-stopped
    networks: [ app-net ]

  promtail:
    image: grafana/promtail:2.9.3
    container_name: promtail
    restart: unless-stopped
    networks: [ app-net ]
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/log/spring:/var/log/spring
      - /var/log/promtail-positions.yml:/var/log/promtail-positions.yml  # ← positions 경로 통일


networks:
  app-net: {}                      # 별도 설정 없이 기본 bridge 네트워크 생성
