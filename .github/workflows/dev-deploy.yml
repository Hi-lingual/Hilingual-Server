name: DEV Deploy

on:                                    # ① 트리거 조건 : develop에 push
  push:
    branches: [develop]

env:                                   # ② 워크플로 전역 환경변수
  APP_HOST: 10.0.2.177                 # 개발용 App EC2 Private IP
  NGINX_HOST: 10.0.1.18                # 공통 Nginx EC2 Private IP
  TZ: Asia/Seoul                       # Runner 로그 타임존

jobs:
  deploy:
    runs-on: ubuntu-latest             # GitHub Hosted Runner

    steps:
      - uses: actions/checkout@v4      # ③ 레포지토리 코드 체크아웃

      - uses: actions/setup-java@v4    # ④ JDK 설치 + Gradle 캐시
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Build JAR   # ⑤ 컴파일
        run: |
          chmod +x ./gradlew && ./gradlew clean build -x test

      - name: 📦 Copy NGINX bundle to Nginx EC2
        uses: appleboy/scp-action@v0.1.6
        with:
          host:        ${{ env.NGINX_HOST }}
          proxy_host:  ${{ secrets.BASTION_IP }}
          proxy_username: ubuntu
          proxy_key:   ${{ secrets.SSH_KEY }}
          username:    ubuntu
          key:         ${{ secrets.SSH_KEY }}
          source:      "nginx/*"
          target:      "/home/ubuntu/nginx/"
          strip_components: 1

      - name: 🔧 Start/Reload Nginx on Nginx EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.NGINX_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_KEY }}
          proxy_host: ${{ secrets.BASTION_IP }}
          proxy_username: ubuntu
          proxy_key: ${{ secrets.SSH_KEY }}
          script_stop: true
          script: |
            set -e
            cd ~/nginx

            # 값 준비
            TARGET_UPSTREAM="${{ env.APP_HOST }}:8081"
            PROJECT="hilingual"
            SERVICE="nginx"

            # Docker 데몬 보장
            sudo systemctl start docker
            sudo systemctl enable docker >/dev/null 2>&1 || true

            # sudo가 env를 보존하도록
            C="sudo --preserve-env=TARGET_UPSTREAM docker compose -p ${PROJECT}"

            # 컨테이너가 이미 떠 있으면 무중단 reload
            cid=$($C ps -q ${SERVICE} || true)
            if [ -n "$cid" ] && sudo docker ps -q --no-trunc | grep -q "$cid"; then
              sudo docker exec -e TARGET_UPSTREAM="$TARGET_UPSTREAM" "$cid" \
                /bin/sh -lc "envsubst '\$TARGET_UPSTREAM' < /etc/nginx/nginx.template.conf > /etc/nginx/conf.d/default.conf && nginx -t && nginx -s reload"
              exit 0
            fi

            # 없으면 최초 기동 (호스트 nginx 충돌 방지)
            sudo systemctl stop nginx 2>/dev/null || true
            $C up -d --remove-orphans ${SERVICE}

            # 컨테이너 기동 대기: 라벨로 안정적으로 조회
            i=0
            cid=""
            while [ $i -lt 30 ]; do
              cid=$(sudo docker ps -q \
                -f "label=com.docker.compose.project=${PROJECT}" \
                -f "label=com.docker.compose.service=${SERVICE}")
              [ -n "$cid" ] && break
              i=$((i+1))
              sleep 1
            done
            if [ -z "$cid" ]; then
              echo "nginx container not found after up; compose ps follows:"
              $C ps || true
              exit 1
            fi

            # 템플릿 치환 + 검증 + 리로드
            sudo docker exec -e TARGET_UPSTREAM="$TARGET_UPSTREAM" "$cid" \
              /bin/sh -lc "envsubst '\$TARGET_UPSTREAM' < /etc/nginx/nginx.template.conf > /etc/nginx/conf.d/default.conf && nginx -t && nginx -s reload"
      

      - name: 📦 Copy JAR to Target
        uses: appleboy/scp-action@v0.1.6
        with:
          host:        ${{ env.APP_HOST }}
          proxy_host:  ${{ secrets.BASTION_IP }}
          proxy_username: ubuntu
          proxy_key: ${{ secrets.SSH_KEY }}
          username:    ubuntu
          key:         ${{ secrets.SSH_KEY }}
          source:      "build/libs/*.jar"
          target:      "/home/ubuntu/artifacts/"
          strip_components: 2

      - name: 🔑 Prepare upstream-switch key on App EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:           ${{ env.APP_HOST }}
          username:       ubuntu
          key:            ${{ secrets.SSH_KEY }}
          proxy_host:     ${{ secrets.BASTION_IP }}
          proxy_username: ubuntu
          proxy_key:      ${{ secrets.SSH_KEY }}
          script_stop:    true
          script: |
            set -e
            mkdir -p ~/.ssh
            chmod 700 ~/.ssh
            cat > ~/.ssh/hilingual_actions <<'EOF'
            ${{ secrets.SSH_KEY }}
            EOF
            chmod 600 ~/.ssh/hilingual_actions

      - name: 🔐 Deploy via Bastion    # ⑥ Bastion 경유 SSH 배포
        uses: appleboy/ssh-action@v1.0.3
        env:
          APP_HOST:   ${{ env.APP_HOST }}        # deploy.sh 에 전달될 변수
          NGINX_HOST: ${{ env.NGINX_HOST }}
        with:
          host:          ${{ env.APP_HOST }}  #  dev App EC2
          username:      ubuntu
          key:           ${{ secrets.SSH_KEY }}     # Repo Secret
          proxy_host:    ${{ secrets.BASTION_IP }}  # (Jump Host = 동일)
          proxy_username: ubuntu
          proxy_key:     ${{ secrets.SSH_KEY }}
          script_stop:   true                       # 서버 오류 시 Job Fail.
          script: |
            set -e
            mkdir -p /home/ubuntu/artifacts
            cd ~/project
            if [ ! -d .git ]; then
              git init
              git remote add origin https://github.com/${{ github.repository }}
            fi
            git fetch --depth 1 origin
            git reset --hard ${{ github.sha }}
            
            mkdir -p build/libs
            mv /home/ubuntu/artifacts/*.jar build/libs/
            
            chmod +x deploy.sh
            ./deploy.sh

      - name: 📢 Discord notify
        if: always()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook:      ${{ secrets.DISCORD_WEBHOOK }}
          title:        "${{ github.workflow }} – ${{ job.status }}"
          description:  "**Ref**: ${{ github.ref_name }}\n**SHA**: ${{ github.sha }}"
          color:        ${{ job.status == 'success' && '0x57F287' || '0xED4245' }}
