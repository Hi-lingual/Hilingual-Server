name: DEV Deploy

on:                                    # ① 트리거 조건 : develop에 push
  push:
    branches: [develop]

env:                                   # ② 워크플로 전역 환경변수
  APP_HOST: 10.0.2.177                 # 개발용 App EC2 Private IP
  NGINX_HOST: 10.0.1.18                # 공통 Nginx EC2 Private IP
  TZ: Asia/Seoul                       # Runner 로그 타임존

jobs:
  deploy:
    runs-on: ubuntu-latest             # GitHub Hosted Runner

    steps:
      - uses: actions/checkout@v4      # ③ 레포지토리 코드 체크아웃

      - uses: actions/setup-java@v4    # ④ JDK 설치 + Gradle 캐시
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Build JAR   # ⑤ 컴파일
        run: |
          chmod +x ./gradlew && ./gradlew clean build -x test

      - name: 📦 Copy NGINX bundle to Nginx EC2
        uses: appleboy/scp-action@v0.1.6
        with:
          host:        ${{ env.NGINX_HOST }}
          proxy_host:  ${{ secrets.BASTION_IP }}
          proxy_username: ubuntu
          proxy_key:   ${{ secrets.SSH_KEY }}
          username:    ubuntu
          key:         ${{ secrets.SSH_KEY }}
          source:      "nginx/*"
          target:      "/home/ubuntu/nginx/"
          strip_components: 1

      - name: 🔧 Start/Reload Nginx on Nginx EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.NGINX_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_KEY }}
          proxy_host: ${{ secrets.BASTION_IP }}
          proxy_username: ubuntu
          proxy_key: ${{ secrets.SSH_KEY }}
          script_stop: true
          script: |
            set -e
            mkdir -p ~/nginx
            chmod +x ~/nginx/start-nginx.sh
            cd ~/nginx
              
            # v1 compose + env 치환
              export TARGET_UPSTREAM="${{ env.APP_HOST }}:8081"
              
            # 이미 nginx 컨테이너가 떠 있으면 재시작 말고 reload만
            cid=$(docker-compose ps -q nginx || true)
            if [ -n "$cid" ] && docker ps -q --no-trunc | grep -q "$cid"; then
              # (옵션) 템플릿을 쓰면 여기서 최신 conf 생성
              ./start-nginx.sh || true
              docker exec "$cid" nginx -s reload
            else
              docker-compose up -d --force-recreate nginx
            fi 

      - name: 📦 Copy JAR to Target
        uses: appleboy/scp-action@v0.1.6
        with:
          host:        ${{ env.APP_HOST }}
          proxy_host:  ${{ secrets.BASTION_IP }}
          proxy_username: ubuntu
          proxy_key: ${{ secrets.SSH_KEY }}
          username:    ubuntu
          key:         ${{ secrets.SSH_KEY }}
          source:      "build/libs/*.jar"
          target:      "/home/ubuntu/artifacts/"
          strip_components: 2

      - name: 🔑 Prepare upstream-switch key on App EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:           ${{ env.APP_HOST }}
          username:       ubuntu
          key:            ${{ secrets.SSH_KEY }}
          proxy_host:     ${{ secrets.BASTION_IP }}
          proxy_username: ubuntu
          proxy_key:      ${{ secrets.SSH_KEY }}
          script_stop:    true
          script: |
            set -e
            mkdir -p ~/.ssh
            chmod 700 ~/.ssh
            cat > ~/.ssh/hilingual_actions <<'EOF'
            ${{ secrets.SSH_KEY }}
            EOF
            chmod 600 ~/.ssh/hilingual_actions

      - name: 🔐 Deploy via Bastion    # ⑥ Bastion 경유 SSH 배포
        uses: appleboy/ssh-action@v1.0.3
        env:
          APP_HOST:   ${{ env.APP_HOST }}        # deploy.sh 에 전달될 변수
          NGINX_HOST: ${{ env.NGINX_HOST }}
        with:
          host:          ${{ env.APP_HOST }}  #  dev App EC2
          username:      ubuntu
          key:           ${{ secrets.SSH_KEY }}     # Repo Secret
          proxy_host:    ${{ secrets.BASTION_IP }}  # (Jump Host = 동일)
          proxy_username: ubuntu
          proxy_key:     ${{ secrets.SSH_KEY }}
          script_stop:   true                       # 서버 오류 시 Job Fail.
          script: |
            set -e
            mkdir -p /home/ubuntu/artifacts
            cd ~/project
            if [ ! -d .git ]; then
              git init
              git remote add origin https://github.com/${{ github.repository }}
            fi
            git fetch --depth 1 origin
            git reset --hard ${{ github.sha }}
            
            mkdir -p build/libs
            mv /home/ubuntu/artifacts/*.jar build/libs/
            
            chmod +x deploy.sh
            ./deploy.sh

      - name: 📢 Discord notify
        if: always()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook:      ${{ secrets.DISCORD_WEBHOOK }}
          title:        "${{ github.workflow }} – ${{ job.status }}"
          description:  "**Ref**: ${{ github.ref_name }}\n**SHA**: ${{ github.sha }}"
          color:        ${{ job.status == 'success' && '0x57F287' || '0xED4245' }}
