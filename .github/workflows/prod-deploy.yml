name: PROD Deploy

on:                                    # 운영 브랜치 push
  push:
    branches: [prod]

env:
  APP_HOST: 10.0.2.63                  # 운영 App EC2
  NGINX_HOST: 10.0.1.18
  TZ: Asia/Seoul

concurrency:                           # 같은 브랜치 두 번 배포 중복 금지
  group: prod-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production            # GitHub “production” Environment
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Build JAR                # 러너에서 JAR 생성
        run: |
          chmod +x ./gradlew
          ./gradlew clean build -x test

      - name: 📦 Copy JAR to Bastion   # 러너 → Bastion 전송
        uses: appleboy/scp-action@v0.1.6
        with:
          host:     ${{ secrets.BASTION_IP }}
          username: ubuntu
          key:      ${{ secrets.SSH_KEY }}
          source:   "build/libs/*.jar"
          target:   "~/project/build/libs/"

      - name: 🔐 Deploy via Bastion    # deploy.sh 실행
        uses: appleboy/ssh-action@v1.0.3
        env:
          APP_HOST:   ${{ env.APP_HOST }}
          NGINX_HOST: ${{ env.NGINX_HOST }}
        with:
          host:           ${{ secrets.BASTION_IP }}
          username:       ubuntu
          key:            ${{ secrets.SSH_KEY }}
          proxy_host:     ${{ secrets.BASTION_IP }}
          proxy_username: ubuntu
          proxy_key:      ${{ secrets.SSH_KEY }}
          script_stop:    true
          script: |
            set -e
            cd ~/project
            if [ ! -d .git ]; then
              git clone --depth 1 https://github.com/${{ github.repository }} .
            fi
            git fetch --all
            git reset --hard ${{ github.sha }}
            cp build/libs/*.jar ./build/libs/
            chmod +x deploy.sh
            ./deploy.sh

      - name: 📢 Discord notify
        if: always()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook:      ${{ secrets.DISCORD_WEBHOOK }}
          title:        "${{ github.workflow }} – ${{ job.status }}"
          description:  "**Ref**: ${{ github.ref_name }}\n**SHA**: ${{ github.sha }}"
          color:        ${{ job.status == 'success' && '0x57F287' || '0xED4245' }}
