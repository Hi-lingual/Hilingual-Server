# ─────────────────────────────────────────────────────────
# 443: 실제 서비스 블록 (인증서 O)
# ── api.hilingual.kr (운영, HTTPS)
server {
  listen 443 ssl;
  http2;
  server_name api.hilingual.kr;

  ssl_certificate     /etc/letsencrypt/live/api.hilingual.kr/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/api.hilingual.kr/privkey.pem;

  ssl_session_timeout 1d;
  ssl_session_cache shared:MozSSL:10m;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers HIGH:!aNULL:!MD5;

  # 업스트림은 prod.inc에서 set $service_url http://IP:PORT; 로 주입
  include /etc/nginx/includes/prod.inc;

  location / {
    proxy_pass $service_url;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_set_header Authorization     $http_authorization;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;

    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
  }

  # 헬스체크
  location = /healthz {
    proxy_pass $service_url/actuator/health;
    proxy_set_header Host      $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_intercept_errors on;
  }

  # 모니터링 프록시 유지
  location = /grafana { return 302 /grafana/; }
  rewrite ^/prometheus$ /prometheus/ permanent;
  rewrite ^/loki$ /loki/ permanent;

  location /grafana/ {
    proxy_pass http://10.0.2.54:3000/grafana/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /grafana;
    proxy_redirect off;
  }
  location /prometheus/ {
    proxy_pass http://10.0.2.54:9090/prometheus/;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location /loki/ {
    proxy_pass http://10.0.2.54:3100/;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

