# ── api.hilingual.kr (운영)
server {
    listen 80;
    server_name api.hilingual.kr;

    # 기본값: 기존처럼 Actions에서 넘기는 TARGET_UPSTREAM 사용 (fallback)
    set $service_url "http://${TARGET_UPSTREAM}";

    # 있으면 덮어씀 (배포 스크립트가 여길 갱신)
    include /etc/nginx/includes/prod.inc*;

    location / {
            return 308 https://$host$request_uri;
        }

    # 기존 /grafana, /prometheus, /loki, =/grafana, =/healthz 내용 대신 전부 리다이렉트
    location = /grafana { return 308 https://$host$request_uri; }
    location /grafana/   { return 308 https://$host$request_uri; }
    location /prometheus/ { return 308 https://$host$request_uri; }
    location /loki/       { return 308 https://$host$request_uri; }
    location = /healthz   { return 308 https://$host$request_uri; }
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;     # 컨테이너 안 경로 (호스트 ./certbot/www)
        default_type "text/plain";
        try_files $uri =404;
    }

}

# ── api-dev.hilingual.kr (개발)
server {
    listen 80;
    server_name api-dev.hilingual.kr;

    # 기본값: TARGET_UPSTREAM (fallback)
    set $service_url "http://${TARGET_UPSTREAM}";

    # 있으면 덮어씀
    include /etc/nginx/includes/dev.inc*;

     location / {
            return 308 https://$host$request_uri;
        }

    # 기존 /grafana, /prometheus, /loki, =/grafana, =/healthz 내용 대신 전부 리다이렉트
    location = /grafana { return 308 https://$host$request_uri; }
    location /grafana/   { return 308 https://$host$request_uri; }
    location /prometheus/ { return 308 https://$host$request_uri; }
    location /loki/       { return 308 https://$host$request_uri; }
    location = /healthz   { return 308 https://$host$request_uri; }
        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;     # 컨테이너 안 경로 (호스트 ./certbot/www)
            default_type "text/plain";
            try_files $uri =404;
        }
}
# ── 운영 HTTPS (새로 추가)
server {
    listen 443 ssl http2;
    server_name api.hilingual.kr;

    # 발급된 인증서 경로 (멀티도메인 포함된 api.hilingual.kr 라인리지)
    ssl_certificate     /etc/letsencrypt/live/api.hilingual.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.hilingual.kr/privkey.pem;

    # 권장 TLS 옵션
    ssl_session_timeout 1d;
    ssl_session_cache shared:MozSSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # 기존 프록시 로직을 443에서 수행
    set $service_url "http://${TARGET_UPSTREAM}";
    include /etc/nginx/includes/prod.inc*;

    location / {
        proxy_pass $service_url;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location = /healthz {
        proxy_pass $service_url/actuator/health;
        proxy_set_header Host      $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_intercept_errors on;
    }

    # (기존 그대로) 모니터링 프록시
    location = /grafana { return 302 /grafana/; }
    rewrite ^/prometheus$ /prometheus/ permanent;
    rewrite ^/loki$ /loki/ permanent;

    location /grafana/ {
        proxy_pass http://10.0.2.54:3000/grafana/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /grafana;
        proxy_redirect off;
    }
    location /prometheus/ {
        proxy_pass http://10.0.2.54:9090/prometheus/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /loki/ {
        proxy_pass http://10.0.2.54:3100/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
