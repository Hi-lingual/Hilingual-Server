map $http_upgrade $connection_upgrade { default upgrade; '' close; } // SSE, WebSocket, gRPC 대비

# ─────────────────────────────────────────────────────────
# 80: ACME 예외 + 나머지 HTTPS 리다이렉트
# ── api.hilingual.kr (운영, HTTP만)
server {
  listen 80;
  server_name api.hilingual.kr;

  include /etc/nginx/includes/prod.inc;

  # ACME 예외
  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type "text/plain";
    try_files $uri =404;
  }

  # 나머지는 HTTPS로
  location / {
    return 308 https://$host$request_uri;
  }
}

# ── api-dev.hilingual.kr (HTTP만)
server {
  listen 80;
  server_name api-dev.hilingual.kr;

  include /etc/nginx/includes/dev.inc;

  # ACME 예외
  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type "text/plain";
    try_files $uri =404;
  }

  # 나머지는 HTTPS로
  location / {
    return 308 https://$host$request_uri;
  }
}

