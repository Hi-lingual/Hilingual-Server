# ── api.hilingual.kr (운영, HTTP만)
server {
  listen 80;
  server_name api.hilingual.kr;

  include /etc/nginx/includes/prod.inc;

  # ACME 예외 (반드시 먼저!)
  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type "text/plain";
    try_files $uri =404;
  }

  # 나머지는 HTTPS로
  location / {
    return 308 https://$host$request_uri;
  }
}

