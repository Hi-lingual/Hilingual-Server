services:
  nginx:
    image: nginx:1.25-alpine
    container_name: hilingual-nginx
    ports: ["80:80","443:443"]
    volumes:

      - /home/ubuntu/nginx/nginx.template.conf:/etc/nginx/conf.d/default.conf:ro
      - /home/ubuntu/nginx/includes:/etc/nginx/includes:rw
      - /home/ubuntu/nginx/certbot/www:/var/www/certbot:ro
      - /home/ubuntu/nginx/certs:/etc/letsencrypt:ro
    restart: unless-stopped

